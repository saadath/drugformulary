<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drug Formulary — Searchable Drug List</title>
<style>
  /* ============ THEME TOKENS ============ */
  :root{
    --bg:#eef2f9;
    --bg-grad-1:rgba(99,102,241,.18);
    --bg-grad-2:rgba(16,185,129,.14);
    --surface:#ffffff;
    --surface-2:#f7f9fc;
    --surface-3:#eef2f8;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --border-strong:#cbd5e1;
    --accent:#4f46e5;
    --accent-2:#7c3aed;
    --accent-soft:rgba(79,70,229,.10);
    --good:#059669;
    --good-bg:rgba(16,185,129,.12);
    --warn:#b45309;
    --warn-bg:rgba(245,158,11,.15);
    --info:#0369a1;
    --info-bg:rgba(14,165,233,.13);
    --purple:#6d28d9;
    --purple-bg:rgba(139,92,246,.13);
    --rose:#be123c;
    --rose-bg:rgba(244,63,94,.12);
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow:0 2px 4px rgba(15,23,42,.05), 0 12px 28px -14px rgba(15,23,42,.30);
    --shadow-lg:0 4px 8px rgba(15,23,42,.06), 0 24px 48px -20px rgba(15,23,42,.38);
    --radius:18px;
  }
  [data-theme="dark"]{
    --bg:#080c18;
    --bg-grad-1:rgba(99,102,241,.22);
    --bg-grad-2:rgba(16,185,129,.12);
    --surface:#111a2e;
    --surface-2:#16203a;
    --surface-3:#1b2742;
    --text:#e8eefb;
    --muted:#93a4c2;
    --border:#233150;
    --border-strong:#33456b;
    --accent:#818cf8;
    --accent-2:#a78bfa;
    --accent-soft:rgba(129,140,248,.16);
    --good:#34d399;
    --good-bg:rgba(52,211,153,.14);
    --warn:#fbbf24;
    --warn-bg:rgba(251,191,36,.14);
    --info:#38bdf8;
    --info-bg:rgba(56,189,248,.14);
    --purple:#c4b5fd;
    --purple-bg:rgba(196,181,253,.14);
    --rose:#fb7185;
    --rose-bg:rgba(251,113,133,.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 4px rgba(0,0,0,.35), 0 16px 32px -16px rgba(0,0,0,.75);
    --shadow-lg:0 4px 10px rgba(0,0,0,.45), 0 28px 56px -20px rgba(0,0,0,.85);
  }

  *{box-sizing:border-box;}
  html{ height:100%; }
  body{
    margin:0;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    transition:background .35s ease,color .35s ease;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-20% -10% auto -10%;
    height:70vh;
    background:
      radial-gradient(45% 60% at 18% 20%, var(--bg-grad-1), transparent 70%),
      radial-gradient(40% 55% at 85% 10%, var(--bg-grad-2), transparent 70%);
    pointer-events:none;
    z-index:0;
    filter:blur(10px);
  }

  /* ============ HEADER (STICKY SEARCH) ============ */
  .header{
    position:-webkit-sticky;
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    border-bottom:1px solid var(--border);
    transition:box-shadow .25s ease, background .35s ease;
  }
  .header.scrolled{
    box-shadow:0 1px 0 var(--border), 0 10px 30px -14px rgba(15,23,42,.22);
  }
  [data-theme="dark"] .header.scrolled{
    box-shadow:0 1px 0 var(--border), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  .header-inner{
    max-width:1500px;
    margin:0 auto;
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:max-content;}
  .logo{
    width:46px;height:46px;border-radius:14px;
    display:grid;place-items:center;
    font-size:24px;font-weight:800;color:#fff;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    box-shadow:0 8px 20px -8px var(--accent);
    letter-spacing:-1px;
    flex-shrink:0;
  }
  .brand h1{
    margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.15;
  }
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:500;}

  .search-wrap{
    position:relative;
    flex:1 1 340px;
    min-width:220px;
    display:flex;
    align-items:center;
  }
  .search-wrap svg{
    position:absolute;left:15px;width:18px;height:18px;
    color:var(--muted);pointer-events:none;transition:color .2s;
  }
  #search{
    width:100%;
    padding:13px 44px 13px 45px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:14px;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  #search::placeholder{color:var(--muted);}
  #search:focus{
    border-color:var(--accent);
    background:var(--surface);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .search-wrap:focus-within svg{color:var(--accent);}
  #clearSearch{
    position:absolute;right:9px;
    width:28px;height:28px;border-radius:9px;
    border:none;cursor:pointer;
    background:transparent;color:var(--muted);
    font-size:19px;line-height:1;
    display:none;place-items:center;
    transition:background .18s,color .18s;
  }
  #clearSearch:hover{background:var(--surface-3);color:var(--text);}
  #clearSearch.show{display:grid;}

  .icon-btn{
    width:46px;height:46px;flex-shrink:0;
    border-radius:14px;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:19px;
    cursor:pointer;
    display:grid;place-items:center;
    transition:transform .18s, background .2s, border-color .2s, box-shadow .2s;
  }
  .icon-btn:hover{background:var(--surface-3);border-color:var(--border-strong);transform:translateY(-1px);}
  .icon-btn:active{transform:scale(.95);}

  /* ============ FILTER BAR (NOT sticky) ============ */
  .filters{
    background:var(--bg);
    border-bottom:1px solid var(--border);
    transition:background .35s ease;
  }
  .filters-inner{
    max-width:1500px;margin:0 auto;
    padding:12px 22px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .filters select{
    appearance:none;
    -webkit-appearance:none;
    font-family:inherit;
    font-size:13px;font-weight:600;
    color:var(--text);
    background:var(--surface);
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 11px center;
    background-size:14px;
    padding:10px 34px 10px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    cursor:pointer;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background-color .2s;
    max-width:230px;
    text-overflow:ellipsis;
  }
  .filters select:hover{border-color:var(--border-strong);}
  .filters select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .filters select.filled{border-color:var(--accent);background-color:var(--accent-soft);}

  .toggle{
    display:inline-flex;align-items:center;gap:7px;
    font-size:13px;font-weight:700;
    padding:10px 15px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    transition:all .2s;
    white-space:nowrap;
  }
  .toggle:hover{border-color:var(--border-strong);color:var(--text);}
  .toggle .pip{
    width:9px;height:9px;border-radius:50%;
    background:var(--border-strong);
    transition:all .2s;
  }
  .toggle.on{color:var(--good);border-color:var(--good);background:var(--good-bg);}
  .toggle.on .pip{background:var(--good);box-shadow:0 0 0 3px var(--good-bg);}
  .toggle.vital.on{color:var(--info);border-color:var(--info);background:var(--info-bg);}
  .toggle.vital.on .pip{background:var(--info);box-shadow:0 0 0 3px var(--info-bg);}

  .spacer{flex:1;}
  #resetBtn{
    font-family:inherit;font-size:13px;font-weight:700;
    padding:10px 15px;border-radius:12px;
    border:1.5px dashed var(--border-strong);
    background:transparent;color:var(--muted);
    cursor:pointer;transition:all .2s;white-space:nowrap;
  }
  #resetBtn:hover{color:var(--rose);border-color:var(--rose);background:var(--rose-bg);}

  /* ============ STATS ============ */
  .stats{
    max-width:1500px;margin:0 auto;
    padding:16px 22px 4px;
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
    font-size:13.5px;color:var(--muted);font-weight:600;
  }
  .stats b{color:var(--text);font-weight:800;font-size:15px;}
  .stats .dot{width:4px;height:4px;border-radius:50%;background:var(--border-strong);}

  /* ============ GRID ============ */
  .grid{
    max-width:1500px;
    margin:0 auto;
    padding:14px 22px 70px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:18px;
    position:relative;
    z-index:1;
  }

  /* ============ CARD ============ */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    padding:18px 18px 14px;
    display:flex;flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    animation:pop .35s cubic-bezier(.2,.8,.3,1) both;
    position:relative;
    overflow:hidden;
  }
  .card::after{
    content:"";
    position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    opacity:0;transition:opacity .25s;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-lg);
    border-color:var(--border-strong);
  }
  .card:hover::after{opacity:1;}

  @keyframes pop{
    from{opacity:0;transform:translateY(14px) scale(.985);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  .card-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:8px;}
  .card-title{
    margin:0;
    font-size:16.5px;
    font-weight:800;
    letter-spacing:-.35px;
    line-height:1.3;
    flex:1;
    word-break:break-word;
  }
  .count-pill{
    flex-shrink:0;
    font-size:11.5px;font-weight:800;
    padding:4px 10px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);
    letter-spacing:.2px;
  }

  .atc{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;
    letter-spacing:.5px;
    color:var(--muted);
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:3px 9px;
    border-radius:7px;
    margin-bottom:9px;
    font-variant-numeric:tabular-nums;
  }
  .atc::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:var(--accent-2);
  }

  .indication{
    font-size:12.8px;
    line-height:1.55;
    color:var(--muted);
    margin:0 0 12px;
    padding:9px 11px;
    background:var(--surface-2);
    border-left:3px solid var(--accent);
    border-radius:0 10px 10px 0;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .badge{
    font-size:10.5px;font-weight:800;
    letter-spacing:.4px;text-transform:uppercase;
    padding:4px 9px;border-radius:7px;
    white-space:nowrap;
  }
  .badge.otc{background:var(--good-bg);color:var(--good);}
  .badge.hosp{background:var(--warn-bg);color:var(--warn);}
  .badge.moh{background:var(--purple-bg);color:var(--purple);}
  .badge.local{background:var(--info-bg);color:var(--info);}
  .badge.e{background:var(--good-bg);color:var(--good);}
  .badge.v{background:var(--info-bg);color:var(--info);}

  .forms{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:5px;
  }
  .form{
    display:flex;align-items:center;gap:8px;
    font-size:12.6px;
    padding:7px 10px;
    border-radius:10px;
    background:var(--surface-2);
    border:1px solid transparent;
    transition:background .18s,border-color .18s;
    flex-wrap:wrap;
  }
  .form:hover{background:var(--surface-3);border-color:var(--border);}
  .form .strength{
    font-weight:800;color:var(--text);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .form .fname{color:var(--muted);font-weight:600;flex:1 1 auto;min-width:0;}
  .form .route{
    font-size:10.5px;font-weight:800;
    letter-spacing:.35px;text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2.5px 7px;border-radius:6px;
    white-space:nowrap;
  }
  .form .mini{
    font-size:9.5px;font-weight:900;
    width:16px;height:16px;border-radius:5px;
    display:grid;place-items:center;
    flex-shrink:0;
  }
  .form .mini.e{background:var(--good-bg);color:var(--good);}
  .form .mini.v{background:var(--info-bg);color:var(--info);}

  .more-btn{
    margin-top:9px;
    font-family:inherit;
    font-size:12.2px;font-weight:800;
    color:var(--accent);
    background:var(--accent-soft);
    border:none;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
    transition:filter .18s, transform .15s;
    letter-spacing:.1px;
  }
  .more-btn:hover{filter:brightness(.94);}
  .more-btn:active{transform:scale(.985);}

  /* ============ EMPTY ============ */
  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
    animation:pop .3s ease both;
  }
  .empty .emoji{font-size:52px;margin-bottom:14px;display:block;opacity:.75;}
  .empty h3{margin:0 0 6px;font-size:17px;color:var(--text);font-weight:800;}
  .empty p{margin:0;font-size:13.5px;}

  mark{
    background:linear-gradient(180deg,transparent 55%, rgba(250,204,21,.65) 55%);
    color:inherit;
    padding:0 1px;
    border-radius:2px;
    font-weight:800;
  }
  [data-theme="dark"] mark{
    background:linear-gradient(180deg,transparent 55%, rgba(250,204,21,.35) 55%);
  }

  /* ============ SCROLLBAR ============ */
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);}

  /* ============ RESPONSIVE ============ */
  @media (max-width:900px){
    .header-inner{padding:12px 16px;gap:12px;}
    .filters-inner{padding:10px 16px;}
    .grid{padding:12px 16px 60px;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));}
    .stats{padding:14px 16px 2px;}
  }
  @media (max-width:560px){
    .brand h1{font-size:16.5px;}
    .brand p{display:none;}
    .logo{width:40px;height:40px;border-radius:12px;font-size:20px;}
    .icon-btn{width:42px;height:42px;border-radius:12px;}
    .grid{grid-template-columns:1fr;padding:12px 12px 60px;}
    .filters-inner{padding:10px 12px;gap:8px;}
    .filters select{flex:1 1 140px;max-width:none;}
    .toggle{flex:1 1 auto;justify-content:center;}
    .stats{padding:12px 12px 0;font-size:12.5px;}
    .card{padding:15px 14px 12px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<header class="header" id="siteHeader">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">℞</div>
      <div>
        <h1>Drug Formulary</h1>
        <p>Search &amp; filter the national drug list</p>
      </div>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search" type="search" autocomplete="off" placeholder="Search drug name, ATC code, ingredient, indication…" />
      <button id="clearSearch" type="button" aria-label="Clear search">×</button>
    </div>

    <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle theme">🌙</button>
  </div>
</header>

<nav class="filters">
  <div class="filters-inner">
    <select id="fAccess" aria-label="Filter by access level"><option value="">All access levels</option></select>
    <select id="fRoute" aria-label="Filter by route"><option value="">All routes</option></select>
    <select id="fForm" aria-label="Filter by dosage form"><option value="">All dosage forms</option></select>
    <button class="toggle" id="fEssential" type="button"><span class="pip"></span>Essential</button>
    <button class="toggle vital" id="fVital" type="button"><span class="pip"></span>Vital</button>
    <div class="spacer"></div>
    <button id="resetBtn" type="button">Reset filters</button>
  </div>
</nav>

<div class="stats" id="stats"></div>

<main class="grid" id="grid"></main>

/* =========================================================================
   NORMALISATION
   ========================================================================= */
const ACCESS = {
  OTC:  { label:"OTC",            cls:"otc",   full:"Over-the-counter" },
  H:    { label:"Hospital",       cls:"hosp",  full:"Hospital only" },
  MOH:  { label:"MOH",            cls:"moh",   full:"Health Dept. of MOH only" },
  L:    { label:"Local",          cls:"local", full:"Local production only" }
};

const drugs = RAW.map(([name, atc, indication, forms]) => {
  const f = forms.map(([form, strength, route, flags, access, note]) => ({
    form:   form   || "",
    strength: strength || "",
    route:  route  || "",
    flags:  flags  || "",
    access: access || "",
    note:   note   || ""
  }));

  const accessSet = [...new Set(f.map(x => x.access).filter(Boolean))];
  const routes    = [...new Set(f.map(x => x.route).filter(Boolean))].sort();
  const formSet   = [...new Set(f.map(x => x.form).filter(Boolean))].sort();

  const haystack = (
    name + " " + (atc || "") + " " + (indication || "") + " " +
    f.map(x => x.form + " " + x.strength + " " + x.route + " " + x.note).join(" ")
  ).toLowerCase();

  return {
    name,
    atc: atc || "",
    indication: indication || "",
    forms: f,
    accessSet,
    routes,
    formSet,
    essential: f.some(x => x.flags.includes("E")),
    vital:     f.some(x => x.flags.includes("V")),
    _s: haystack
  };
}).sort((a, b) => a.name.localeCompare(b.name, "en", { sensitivity:"base" }));

/* =========================================================================
   STATE
   ========================================================================= */
const state = {
  q: "",
  access: "",
  route: "",
  form: "",
  essential: false,
  vital: false
};
const expanded = new Set();

/* =========================================================================
   DOM
   ========================================================================= */
const grid        = document.getElementById("grid");
const stats       = document.getElementById("stats");
const searchInput = document.getElementById("search");
const clearSearch = document.getElementById("clearSearch");
const fAccess     = document.getElementById("fAccess");
const fRoute      = document.getElementById("fRoute");
const fForm       = document.getElementById("fForm");
const fEssential  = document.getElementById("fEssential");
const fVital      = document.getElementById("fVital");
const resetBtn    = document.getElementById("resetBtn");
const themeBtn    = document.getElementById("themeBtn");
const headerEl    = document.getElementById("siteHeader");

/* =========================================================================
   HELPERS
   ========================================================================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}
function hl(text, q){
  if (!q) return esc(text);
  const lower = text.toLowerCase();
  const i = lower.indexOf(q);
  if (i === -1) return esc(text);
  return esc(text.slice(0, i)) +
         "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" +
         esc(text.slice(i + q.length));
}

/* =========================================================================
   POPULATE FILTERS
   ========================================================================= */
(function buildFilters(){
  const accessVals = new Set();
  const routeVals  = new Set();
  const formVals   = new Set();

  drugs.forEach(d => {
    d.accessSet.forEach(a => accessVals.add(a));
    d.routes.forEach(r => routeVals.add(r));
    d.formSet.forEach(f => formVals.add(f));
  });

  [...accessVals].sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = (ACCESS[v] ? ACCESS[v].full : v);
    fAccess.appendChild(o);
  });

  [...routeVals].sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    fRoute.appendChild(o);
  });

  [...formVals].sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    fForm.appendChild(o);
  });
})();

/* =========================================================================
   RENDER
   ========================================================================= */
const FORM_LIMIT = 6;

function render(){
  const q = state.q;

  const filtered = drugs.filter(d => {
    if (q && !d._s.includes(q)) return false;
    if (state.access && !d.accessSet.includes(state.access)) return false;
    if (state.route  && !d.routes.includes(state.route)) return false;
    if (state.form   && !d.formSet.includes(state.form)) return false;
    if (state.essential && !d.essential) return false;
    if (state.vital     && !d.vital) return false;
    return true;
  });

  let totalForms = 0;
  filtered.forEach(d => totalForms += d.forms.length);

  /* ---- stats ---- */
  stats.innerHTML =
    `<b>${filtered.length}</b> drug${filtered.length === 1 ? "" : "s"} ` +
    `<span class="dot"></span> <b>${totalForms}</b> dosage form${totalForms === 1 ? "" : "s"}` +
    (filtered.length !== drugs.length ? ` <span class="dot"></span> of ${drugs.length} total` : "");

  /* ---- empty ---- */
  if (!filtered.length){
    grid.innerHTML = `
      <div class="empty">
        <span class="emoji">🔍</span>
        <h3>No drugs found</h3>
        <p>Try a different search term or reset the filters.</p>
      </div>`;
    return;
  }

  /* ---- cards ---- */
  const html = filtered.map((d, idx) => {
    const isOpen = expanded.has(d.name);
    const shown  = isOpen ? d.forms : d.forms.slice(0, FORM_LIMIT);
    const hidden = d.forms.length - shown.length;

    const badges = [];
    if (d.essential) badges.push('<span class="badge e" title="Essential medicine">Essential</span>');
    if (d.vital)     badges.push('<span class="badge v" title="Vital medicine">Vital</span>');
    d.accessSet.forEach(a => {
      const meta = ACCESS[a];
      if (meta) badges.push(`<span class="badge ${meta.cls}" title="${esc(meta.full)}">${esc(meta.label)}</span>`);
      else      badges.push(`<span class="badge local">${esc(a)}</span>`);
    });

    const formsHTML = shown.map(f => {
      const minis =
        (f.flags.includes("E") ? '<span class="mini e" title="Essential">E</span>' : "") +
        (f.flags.includes("V") ? '<span class="mini v" title="Vital">V</span>' : "");
      const title = f.note ? ` title="${esc(f.note)}"` : "";
      return `<li class="form"${title}>
        ${f.strength ? `<span class="strength">${esc(f.strength)}</span>` : ""}
        <span class="fname">${esc(f.form)}</span>
        ${f.route ? `<span class="route">${esc(f.route)}</span>` : ""}
        ${minis}
      </li>`;
    }).join("");

    return `<article class="card" style="animation-delay:${Math.min(idx * 14, 320)}ms">
      <div class="card-head">
        <h2 class="card-title">${hl(d.name, q)}</h2>
        <span class="count-pill">${d.forms.length} form${d.forms.length === 1 ? "" : "s"}</span>
      </div>
      ${d.atc ? `<span class="atc">${esc(d.atc)}</span>` : ""}
      ${d.indication ? `<p class="indication">${esc(d.indication)}</p>` : ""}
      ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}
      <ul class="forms">${formsHTML}</ul>
      ${hidden > 0 ? `<button class="more-btn" data-more="${esc(d.name)}">+ Show ${hidden} more form${hidden === 1 ? "" : "s"}</button>` : ""}
      ${isOpen && d.forms.length > FORM_LIMIT ? `<button class="more-btn" data-more="${esc(d.name)}">− Show fewer</button>` : ""}
    </article>`;
  }).join("");

  grid.innerHTML = html;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
let searchTimer;
searchInput.addEventListener("input", e => {
  state.q = e.target.value.trim().toLowerCase();
  clearSearch.classList.toggle("show", e.target.value.length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 110);
});

clearSearch.addEventListener("click", () => {
  searchInput.value = "";
  state.q = "";
  clearSearch.classList.remove("show");
  searchInput.focus();
  render();
});

fAccess.addEventListener("change", e => {
  state.access = e.target.value;
  e.target.classList.toggle("filled", !!e.target.value);
  render();
});
fRoute.addEventListener("change", e => {
  state.route = e.target.value;
  e.target.classList.toggle("filled", !!e.target.value);
  render();
});
fForm.addEventListener("change", e => {
  state.form = e.target.value;
  e.target.classList.toggle("filled", !!e.target.value);
  render();
});
fEssential.addEventListener("click", () => {
  state.essential = !state.essential;
  fEssential.classList.toggle("on", state.essential);
  render();
});
fVital.addEventListener("click", () => {
  state.vital = !state.vital;
  fVital.classList.toggle("on", state.vital);
  render();
});

resetBtn.addEventListener("click", () => {
  state.q = ""; state.access = ""; state.route = ""; state.form = "";
  state.essential = false; state.vital = false;
  searchInput.value = "";
  clearSearch.classList.remove("show");
  fAccess.value = ""; fRoute.value = ""; fForm.value = "";
  fAccess.classList.remove("filled"); fRoute.classList.remove("filled"); fForm.classList.remove("filled");
  fEssential.classList.remove("on"); fVital.classList.remove("on");
  expanded.clear();
  render();
});

/* expand / collapse dosage forms */
grid.addEventListener("click", e => {
  const btn = e.target.closest("[data-more]");
  if (!btn) return;
  const name = btn.getAttribute("data-more");
  if (expanded.has(name)) expanded.delete(name);
  else expanded.add(name);
  render();
});

/* =========================================================================
   THEME
   ========================================================================= */
const THEME_KEY = "formulary-theme";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  themeBtn.title = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
}
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
  if (!saved){
    saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(saved);
})();
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});

/* =========================================================================
   HEADER SHADOW ON SCROLL
   ========================================================================= */
window.addEventListener("scroll", () => {
  headerEl.classList.toggle("scrolled", window.scrollY > 8);
}, { passive: true });

/* =========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================= */
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if (e.key === "Escape" && document.activeElement === searchInput){
    searchInput.value = "";
    state.q = "";
    clearSearch.classList.remove("show");
    render();
  }
});

/* =========================================================================
   GO
   ========================================================================= */
render();
</script>
